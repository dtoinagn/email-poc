# Bilingual copy that doesn't vary per HaltMessage — subjects, in-body headings, and the handful of row
# labels/intro clauses the requirements doc marks "French TBD". Loaded by
# ca.iiroc.halt.email.template.EmailCopy as a flat UTF-8 properties file: every CIRO halt email is one
# bilingual document (EN and FR on the same line), not a per-viewer-locale render, so this is a plain
# key/value lookup rather than a Spring MessageSource.
#
# Where the requirements doc gives final French, it's used verbatim below. Where it says "French TBD",
# the English text is mirrored as a placeholder (see design doc §06, §10) -- update the value in place
# once Communications/Surveillance finalizes the wording; no code change needed.

# --- Subjects (also reused as the in-body heading line -- the two are identical text in every template) ---

# Final -- requirements doc page 8
traditional-halt.subject=Canadian Investment Regulatory Organization Trading Halt / Suspension de la négociation par l’Organisme canadien de réglementation des investissements

# French TBD -- placeholder mirrors English
sscb-halt.subject=Canadian Investment Regulatory Organization Single Stock Circuit Breaker Halt / Canadian Investment Regulatory Organization Single Stock Circuit Breaker Halt
sscb-extension.subject=Canadian Investment Regulatory Organization Single Stock Circuit Breaker Halt Extended / Canadian Investment Regulatory Organization Single Stock Circuit Breaker Halt Extended
sscb-to-reg.subject=Canadian Investment Regulatory Organization Single Stock Circuit Breaker Halt Converted to Traditional Halt / Canadian Investment Regulatory Organization Single Stock Circuit Breaker Halt Converted to Traditional Halt
reason-update.subject=Canadian Investment Regulatory Organization Trading Halt Reason Update / Canadian Investment Regulatory Organization Trading Halt Reason Update
resumption-cancellation.subject=Canadian Investment Regulatory Organization Trade Resumption Cancellation / Canadian Investment Regulatory Organization Trade Resumption Cancellation
resumption-time-update.subject=Canadian Investment Regulatory Organization Trade Resumption Time Update / Canadian Investment Regulatory Organization Trade Resumption Time Update

# Final -- requirements doc page 14
resumption.subject=Canadian Investment Regulatory Organization Trade Resumption / L’Organisme canadien de réglementation des investissements permet la reprise de la négociation

# --- Row labels / intro clauses still marked "French TBD" (everything else -- Company / Société,
#     All Issues / Tous les Titres, Reason / Motif, Halt Time (ET) / Heure de la suspension (HE), and the
#     footer -- is already final bilingual text baked directly into the templates) ---

# Used by sscb-extension, sscb-to-reg, reason-update, resumption-cancellation (pages 10-13)
intro.remainHalted=The following issues remain halted by CIRO / The following issues remain halted by CIRO

# Used by sscb-halt, sscb-extension, resumption, resumption-time-update (pages 9, 10, 14, 15) -- only the
# French half of this specific row label is TBD, even in the two templates whose subject/intro is final
resumptionTimeLabel=Resumption Time (ET) / Resumption Time (ET)
